name: Compatibility report
description: It works (or does not) on my TV
title: "Compatibility: <model>, webOS <version>"
labels: [compatibility]
body:
  - type: input
    id: tv
    attributes: {label: TV model and webOS version}
    validations: {required: true}
  - type: dropdown
    id: result
    attributes: {label: Result, options: [Works fully, Works with problems, Does not work]}
    validations: {required: true}
  - type: textarea
    id: notes
    attributes: {label: Notes, description: What worked, what did not, error messages}
